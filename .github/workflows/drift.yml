name: drift

# Read-only drift check: compares production with a database built from supabase/migrations.
# Judged on the diff content, not the exit code. Never writes to production.
on:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:
  # After each deploy: add a workflow_run trigger on the deploy workflow once the deploy path exists.

permissions:
  contents: read
  issues: write

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  drift:
    name: drift
    # Secrets live in the GitHub Environment `production`, restricted to main, so PR-branch
    # workflows can never read them. The person creates the environment and its secrets.
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRIFT_SCHEMAS: public
    # Secrets are given only to the steps that need them (not to npm ci or other steps).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the production connection secrets
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
          HAS_PROJECT: ${{ secrets.SUPABASE_PROJECT_ID != '' }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = true ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ "$HAS_PASSWORD" = true ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ "$HAS_PROJECT" = true ] || missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Drift check not configured. Missing GitHub Secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only; brings the pinned Supabase CLI)
        run: npm ci

      - name: Link the production project (read-only use)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_ID" # expects SUPABASE_DB_PASSWORD from env (confirm on the first run)

      - name: supabase db diff against production
        id: diff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          # The repo is public: never print the schema diff to the log (S18). CLI errors are shown (secrets are masked).
          if ! npx --no-install supabase db diff --remote --schema "$DRIFT_SCHEMAS" >diff.sql 2>diff.err; then
            echo "::error::supabase db diff did not run"; tail -20 diff.err; exit 1
          fi
          # Judge on content: anything other than blank lines and SQL comments is drift.
          CHANGED_LINES=$(grep -cvE '^[[:space:]]*(--.*)?$' diff.sql || true)
          echo "diff: $CHANGED_LINES non-comment lines, sha256 $(sha256sum diff.sql | cut -c1-12)"
          # Pass only on an exact "0"; anything else (non-empty diff, odd output) is treated as drift (fails closed).
          if [ "$CHANGED_LINES" != "0" ]; then
            echo "drift=yes" >> "$GITHUB_OUTPUT"
            echo "::error::Drift: production differs from supabase/migrations"
            exit 1
          fi
          echo "drift=no" >> "$GITHUB_OUTPUT"
          echo "No drift."

      - name: Open or update the drift issue
        if: failure() && steps.diff.outputs.drift == 'yes'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The repo is public: link to the run, never paste the schema diff into the issue.
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Drift check failed: ${run}\n\nProduction differs from \`supabase/migrations\`. The run log shows only a line count and hash (public repo); db-builder reproduces the diff locally with the read-only \`supabase db diff --remote\` (rules/database-and-deploy.md rule 7).\n\nAll deploys stop until this is fixed (ORCHESTRATOR stop rule 1). Owner: db-builder.`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'drift' });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: 'Drift: production differs from migrations', labels: ['drift'], body });
            }
